services:
  - type: web
    name: teaching-management
    runtime: python
    plan: free
    buildCommand: pip install -r SEPM_backend/requirements.txt
    startCommand: cd SEPM_backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
